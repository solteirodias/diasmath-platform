name: Build DIASMATH

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    if: ${{ github.event_name == 'pull_request' || !contains(github.event.head_commit.message, 'Atualiza build estático do DIASMATH Sprint') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install site dependencies
        run: npm install --no-audit --no-fund

      - name: Import 5th Simula+ into original SAP
        run: node scripts/import-simula5-inside-sap.mjs

      - name: Generate 2nd series report dataset
        run: node scripts/export-sap-2serie-report.mjs

      - name: Validate games
        run: npm run test:games

      - name: Validate labs
        run: npm run test:labs

      - name: Validate Forms security
        run: npm run test:forms

      - name: Validate embedded materials
        run: npm run test:materials

      - name: Build DIASMATH Sprint
        run: npm run build:sprint

      - name: Integrate ENEM+ into original SAP
        run: node scripts/install-enem-inside-sap.mjs

      - name: Validate main site
        run: npm run build

      - name: Publish Sprint static build into repository
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f public/sprint
          git add public/escolas/sap-avaliacoes-2026/index.html
          git add public/escolas/sap-avaliacoes-2026/dados.json
          git add docs/SAP_2_SERIE_EXPORT_2026.b64
          if git diff --cached --quiet; then
            echo "Sprint static build unchanged."
          else
            git commit -m "Atualiza build estático do DIASMATH Sprint"
            git push
          fi
