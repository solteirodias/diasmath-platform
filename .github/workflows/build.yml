name: Build DIASMATH

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, 'Atualiza build estático do DIASMATH Sprint') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install site dependencies
        run: npm install --no-audit --no-fund

      - name: Build DIASMATH Sprint
        run: npm run build:sprint

      - name: Validate main site
        run: npm run build

      - name: Publish Sprint static build into repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f public/sprint
          if git diff --cached --quiet; then
            echo "Sprint static build unchanged."
          else
            git commit -m "Atualiza build estático do DIASMATH Sprint"
            git push
          fi
