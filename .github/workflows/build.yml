name: Build DIASMATH

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    if: ${{ github.event_name == 'pull_request' || !contains(github.event.head_commit.message, 'Atualiza build estático do DIASMATH Sprint') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install site dependencies
        run: npm install --no-audit --no-fund

      - name: Inspect SAP Simula schema
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const db = JSON.parse(fs.readFileSync("public/escolas/sap-avaliacoes-2026/dados.json","utf8"));
          const shape = x => Array.isArray(x)?{type:"array",len:x.length,sample:x.length?Object.keys(x[0]||{}).slice(0,30):[]}:(x && typeof x==="object"?{type:"object",keys:Object.keys(x).slice(0,40)}:String(x).slice(0,100));
          console.log("SAP_SCHEMA_TOP",JSON.stringify(shape(db)));
          for(const [k,v] of Object.entries(db)) console.log("SAP_SCHEMA_KEY",k,JSON.stringify(shape(v)));
          const matches=[];
          function walk(x,path,depth){
            if(matches.length>5 || depth>6 || x===null || typeof x!=="object")return;
            if(Array.isArray(x)) {for(let i=0;i<Math.min(x.length,100);i++)walk(x[i],path+"["+i+"]",depth+1);return}
            const ent=Object.entries(x);
            if(ent.some(([k,v])=> typeof v==="string" && /simula\s*\+/i.test(v))){
              matches.push({path,fields:ent.map(([k,v])=>[k,shape(v)]).slice(0,35),sample:JSON.stringify(x).slice(0,1000)});
            }
            for(const [k,v] of ent)if(typeof v==="object")walk(v,path+"."+k,depth+1);
          }
          walk(db,"root",0);
          console.log("SAP_SIMULA_SAMPLES",JSON.stringify(matches));
          console.log("SAP_SIMULA_GROUPS",JSON.stringify(db.groups.filter(g=>g.instrument==="Simula+").map(g=>({id:g.id,sequence:g.sequence,grade:g.grade,discipline:g.discipline,n:g.schools?.length,source:g.sources?.[0]}))));
          const html=fs.readFileSync("public/escolas/sap-avaliacoes-2026/index.html","utf8");
          for(const pat of ["function populateFilters","function renderAll","function renderSimula","function setTab","const GRADES","gradeSelect","state.grade"]){
            let idx=html.indexOf(pat);if(idx>=0) console.log("SAP_HTML_SNIPPET",pat,html.slice(Math.max(0,idx-120),idx+1700).replace(/\\s+/g," "));
          }
          NODE
      - name: Validate games
        run: npm run test:games

      - name: Validate labs
        run: npm run test:labs

      - name: Validate Forms security
        run: npm run test:forms

      - name: Validate embedded materials
        run: npm run test:materials

      - name: Build DIASMATH Sprint
        run: npm run build:sprint

      - name: Integrate ENEM+ into original SAP
        run: node scripts/install-enem-inside-sap.mjs

      - name: Validate main site
        run: npm run build

      - name: Publish Sprint static build into repository
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f public/sprint
          git add public/escolas/sap-avaliacoes-2026/index.html
          if git diff --cached --quiet; then
            echo "Sprint static build unchanged."
          else
            git commit -m "Atualiza build estático do DIASMATH Sprint"
            git push
          fi
