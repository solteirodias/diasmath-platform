name: Build DIASMATH

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install site dependencies
        run: npm install --no-audit --no-fund
      - name: Build site and Sprint
        run: npm run build
