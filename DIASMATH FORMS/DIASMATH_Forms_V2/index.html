<!doctype html><html><head><meta charset="utf-8"><title>DIASMATH Forms V2</title>
<link rel="stylesheet" href="css/style.css"></head><body>
<header><h2>DIASMATH Forms V2</h2></header>
<div class="container">
<div class="grid">
<div class="card">
<h3>Criar Questionário</h3>
<input id="titulo" placeholder="Título">
<div id="lista"></div>
<button onclick="addTexto()">+ Resposta curta</button>
<button onclick="addLongo()">+ Parágrafo</button>
<button onclick="addOpcao()">+ Múltipla escolha</button>
<button onclick="salvar()">Salvar</button>
</div>
<div class="card">
<h3>Dashboard</h3>
<p>Questionários: <span id="qtd">0</span></p>
<p>Respostas: 0</p>
<p>Gráficos: em breve (Chart.js)</p>
</div>
</div>
</div>
<script src="js/app.js"></script>
</body></html>
