<!doctype html><html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="css/style.css"><title>DIASMATH Forms V30</title></head>
<body>
<header>DIASMATH Forms V30</header>
<div class="wrap grid">
<div class="card">
<h3>Formulários</h3>
<div id="forms" class="list"></div>
<button onclick="newForm()">Novo</button>
<button onclick="duplicate()">Duplicar</button>
<button onclick="saveForm()">Salvar</button>
</div>
<div class="card">
<h3>Editor</h3>
<input id="title" placeholder="Título" oninput="updatePreview()">
<textarea id="desc" placeholder="Descrição" oninput="updatePreview()"></textarea>
<button onclick="addQuestion()">Adicionar pergunta</button>
<div id="editor"></div>
</div>
<div class="card">
<h3>Pré-visualização</h3>
<div id="preview"></div>
</div>
</div>
<script src="js/app.js"></script>
</body></html>
